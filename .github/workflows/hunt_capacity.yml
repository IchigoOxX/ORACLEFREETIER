name: Oracle ARM Capacity Hunter

on:
  schedule:
    # Backup trigger every 6 hours in case any cycle gets interrupted
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  actions: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Run up to 6 hours per job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install oci

      - name: Run Cloud Bot
        id: hunter
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION || 'eu-paris-1' }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RETRY_INTERVAL: 25
          MAX_MINUTES: 330
        run: |
          python -u cloud_bot.py

      - name: Auto-Retrigger Next Cycle
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          echo "Current 5.5h cycle completed without capacity. Launching next cycle immediately..."
          gh workflow run hunt_capacity.yml --ref main
